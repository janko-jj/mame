name: CI (macOS)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macOS-latest
    permissions: 
        actions: write
    env:
       CCACHE_DIR: "${{ github.workspace }}/.ccache"
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl2
    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1.5.2      
    - name: Build
      env:
        USE_LIBSDL: 1
        SOURCES: sinclair/sprinter.cpp,sinclair/tsconf.cpp,sinclair/specnext.cpp,sinclair/pentevo.cpp,sinclair/spectrum.cpp,sinclair/spec128.cpp,sinclair/specpls3.cpp,sinclair/scorpion.cpp
        TOOLS: 1
        PRECOMPILE: 0
        REGENIE: 1
      run: make -j$(nproc)
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-${{ github.sha }}
        path: |
          mame
        if-no-files-found: error
